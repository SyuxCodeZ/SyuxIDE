<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://127.0.0.1:9090 http://localhost:9090;">
  <title>SYUX IDE</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../node_modules/xterm/css/xterm.css" />
</head>
<body>
  <div id="topbar">
    <span id="logo">SYUX IDE</span>
    <select id="language-select">
      <option value="cpp">C++</option>
      <option value="go">Go</option>
    </select>
    <button id="run-btn">&#9654; Run</button>
    <span id="status"></span>
  </div>

  <div id="main-container">
    <div id="editor-container"></div>
  </div>

  <div id="terminal-container"></div>

  <div id="input-area">
    <span id="input-label">stdin:</span>
    <textarea id="input-box" placeholder="Program input (one value per line)"></textarea>
  </div>

  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="../node_modules/xterm/lib/xterm.js"></script>
  <script src="../node_modules/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script src="editor.js"></script>
  <script src="terminal.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
