<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; connect-src 'self' http://localhost:9090;">
  <title>SYUX IDE</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
</head>
<body>
  <div id="topbar">
    <span id="logo">SYUX IDE</span>
    <select id="language-select">
      <option value="cpp">C++</option>
      <option value="go">Go</option>
    </select>
    <button id="run-btn">&#9654; Run</button>
    <span id="status"></span>
  </div>

  <div id="main-container">
    <div id="editor-container"></div>
  </div>

  <div id="terminal-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="editor.js"></script>
  <script src="terminal.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
